  - name: items
    label: 依頼項目と料金
    file: content/estimate.json
    fields:
    - name: items
      label: 依頼項目（この順番で並びます）
      widget: list
      fields:
      - name: id
        label: ID
        widget: string
        hint: 半角英数字。一度決めたら変えない（例：prog）
      - name: name
        label: 項目名
        widget: string
      - name: scaled
        label: ゲームの規模（小・中・大）で金額が変わる
        widget: boolean
        default: true
        hint: オフにすると、下の「プラン」で金額を決めます
      - name: price
        label: 金額（規模で変わる項目）
        widget: object
        fields:
        - name: s
          label: 小（円）
          widget: number
          value_type: int
          required: false
        - name: m
          label: 中（円）
          widget: number
          value_type: int
          required: false
        - name: l
          label: 大（円）
          widget: number
          value_type: int
          required: false
        required: false
      - name: unit
        label: 規模ごとの単位・内容（任意）
        widget: object
        fields:
        - name: s
          label: 小
          widget: string
          required: false
          hint: 例：小物1点
        - name: m
          label: 中
          widget: string
          required: false
        - name: l
          label: 大
          widget: string
          required: false
        required: false
        collapsed: true
      - name: plans
        label: プラン（規模で変わらない項目）
        widget: list
        fields:
        - name: k
          label: 並び
          widget: select
          options:
          - label: 1つ目
            value: s
          - label: 2つ目
            value: m
          - label: 3つ目
            value: l
        - name: label
          label: プラン名
          widget: string
          hint: 例：1時間
        - name: price
          label: 金額（円）
          widget: number
          value_type: int
        label_singular: プラン
        required: false
        summary: '{{fields.label}} {{fields.price}}円'
      - name: can
        label: できること
        widget: text
        required: false
      - name: ng
        label: できないこと
        widget: text
        required: false
      - name: at
        label: ご注意
        widget: text
        required: false
      label_singular: 依頼項目
      summary: '{{fields.name}}'
