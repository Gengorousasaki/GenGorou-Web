        label_singular: リンク
        summary: '{{fields.label}}'
        hint: 1つ目のリンクがテレビのボタンになります
      - name: gen
        label: 横にいるげんちゃん
        widget: select
        options:
        - label: 指さし
          value: point
        - label: 肩をすくめる
          value: shrug
        - label: しょんぼり
          value: tired
        - label: 手を振る
          value: wave
        default: point
      - name: flip
        label: げんちゃんを左右反転
        widget: boolean
        default: false
      - name: say
        label: げんちゃんの一言
        widget: string
        required: false
        hint: 短く。例：積めば勝てる。…たぶん。
      label_singular: 作品
      summary: '{{fields.t}}（{{fields.st}}）'
  - name: topics
    label: お知らせ
    file: content/topics.json
    fields:
    - name: items
      label: お知らせ一覧（日付の新しい順に自動で並びます）
      widget: list
      fields:
      - name: d
        label: 日付
        widget: string
        hint: 「2026.11.06」の形で入力（ゼロ埋め）。この順で並びます
      - name: p
        label: 作品名
        widget: string
        hint: 例：がむしゃらギルド
      - name: t
        label: 内容
        widget: string
        hint: 例：東京ゲームショウ2026 に出展しました
      label_singular: お知らせ
      summary: '{{fields.d}}　{{fields.t}}'
- name: estimate
