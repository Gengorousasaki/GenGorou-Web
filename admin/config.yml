  - name: games
    label: 作品
    file: content/games.json
    fields:
    - name: items
      label: 作品一覧（この順番でトップに並び、テレビのチャンネルにもなります）
      widget: list
      fields:
      - name: id
        label: ID
        widget: string
        hint: 半角英数字。作品ごとに別の名前にする（例：guild）
      - name: t
        label: 作品名
        widget: string
      - name: s
        label: 紹介文
        widget: text
        hint: 1〜2文。テレビの画面にも出ます
      - name: st
        label: 状況
        widget: string
        hint: 例：配信中 / 体験版配信中 / 2027.3.15 発売予定
      - name: soon
        label: 発売前（状況をピンクで表示）
        widget: boolean
        default: false
      - name: plat
        label: 対応機種
        widget: string
        hint: 例：Steam / 2〜4人協力
