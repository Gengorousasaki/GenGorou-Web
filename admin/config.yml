# G3 公式サイトの管理画面の設定（Sveltia CMS）
# 保存すると GitHub の main ブランチに直接保存され、数分でサイトに反映されます。
# このファイルは手で編集してもいいですが、壊すと管理画面が開かなくなるので注意。

backend:
  name: github
  repo: Gengorousasaki/gengorou-web
  branch: main
  commit_messages:
    create: 管理画面：{{collection}}「{{slug}}」を作成
    update: 管理画面：{{collection}}「{{slug}}」を更新
    delete: 管理画面：{{collection}}「{{slug}}」を削除
    uploadMedia: 管理画面：画像「{{path}}」を追加
    deleteMedia: 管理画面：画像「{{path}}」を削除
media_folder: img/uploads
public_folder: /img/uploads
site_url: https://gengorougames.com
display_url: https://gengorougames.com
collections:
- name: home
  label: トップページ
  files:
  - name: site
    label: サイト全体（メニュー・SNS・フッター）
    file: content/site.json
    fields:
    - name: title
      label: ブラウザのタブに出るサイト名
      widget: string
    - name: logo
      label: ロゴの文字
      widget: string
      default: G3
    - name: logoSub
      label: ロゴの横の小さい文字
      widget: string
      required: false
    - name: nav
      label: 上部メニュー
      widget: list
      fields:
      - name: label
        label: 文字
        widget: string
      - name: href
        label: リンク先
        widget: string
        hint: ページ内なら「#games」のように。外のサイトなら https://〜
      - name: accent
        label: ピンクで目立たせる
        widget: boolean
        default: false
      label_singular: メニュー
      summary: '{{fields.label}}'
    - name: sns
      label: SNSのリンク
      widget: list
      fields:
      - name: label
        label: 名前
        widget: string
        hint: 例：X
      - name: url
        label: URL
        widget: string
      label_singular: SNS
      summary: '{{fields.label}}'
    - name: footer
      label: フッター
      widget: object
      fields:
      - name: copy
        label: 左の文字
        widget: string
        required: false
      - name: contact
        label: 右の文字
        widget: string
        required: false
      - name: sleeper
        label: 寝転がるげんちゃんを出す
        widget: boolean
        default: true
      - name: say
        label: げんちゃんのセリフ
        widget: string
        required: false
  - name: layout
    label: トップページの構成と文章
    file: content/home.json
    fields:
    - name: blocks
      label: トップページの構成（上から順に表示。ドラッグで並び替え）
      widget: list
      label_singular: ブロック
      typeKey: type
      summary: '{{fields.title}}'
      types:
      - name: tv
        label: テレビ（最初の画面）
        widget: object
        summary: テレビ：{{fields.title}}
        fields:
        - name: show
          label: 表示する
          widget: boolean
          default: true
        - name: id
          label: ページ内リンク用の名前
          widget: string
          required: false
          hint: 半角英字。メニューの「#名前」で、ここに飛べます（例：games）
        - name: title
          label: 見出し
          widget: text
          hint: 「*ここ*」で囲むとピンクの強調。改行もそのまま反映されます
        - name: lead
          label: 説明文
          widget: text
          required: false
        - name: sleep
          label: 寝ているときのセリフ
          widget: list
          field:
            name: v
            label: セリフ
            widget: string
          hint: ランダムで1つ出ます
        - name: wake
          label: 起こしたときのセリフ
          widget: list
          field:
            name: v
            label: セリフ
            widget: string
          hint: ランダムで1つ出ます
        - name: hint
          label: げんちゃんの下の小さい案内
          widget: string
          required: false
        - name: interval
          label: チャンネルが切り替わる間隔（秒）
          widget: number
          value_type: int
          default: 6
          min: 2
          max: 60
      - name: games
        label: 作品一覧
        widget: object
        summary: 作品一覧：{{fields.title}}
        fields:
        - name: show
          label: 表示する
          widget: boolean
          default: true
        - name: id
          label: ページ内リンク用の名前
          widget: string
          required: false
          hint: 半角英字。メニューの「#名前」で、ここに飛べます（例：games）
        - name: title
          label: 見出し
          widget: text
          hint: 「*ここ*」で囲むとピンクの強調。改行もそのまま反映されます
        - name: lead
          label: 説明文
          widget: text
          required: false
        - name: bg
          label: 背景色
          widget: select
          options:
          - label: うすい青白（基本）
            value: paper
          - label: 白
            value: white
          - label: ピンク
            value: pink
          - label: 紺
            value: navy
          default: paper
      - name: news
        label: お知らせ
        widget: object
