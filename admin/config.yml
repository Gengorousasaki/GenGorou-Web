        required: false
        hint: PC向け作品はここに入れる。1枚目がトップとテレビに出ます
      - name: phone
        label: スマホ画面（縦長・3枚）
        widget: list
        field:
          name: src
          label: 画像
          widget: image
        label_singular: 画面
        required: false
        hint: スマホ作品だけ入れる（入れるとゲーム画面より優先）
      - name: watch
        label: アイコンだけで見せる場合の画像
        widget: image
        required: false
        hint: 画面写真がない作品用（Watchなど）
      - name: tagline
        label: アイコンの下の小さい文字
        widget: string
        required: false
        hint: アイコンで見せる場合だけ使います（例：体験する映画）
      - name: thumb
        label: チャンネルボタンの小さい画像
        widget: image
        hint: 横長（Steamのヘッダー画像など）
      - name: links
        label: リンク
        widget: list
        fields:
        - name: label
          label: ボタンの文字
          widget: string
          hint: 例：Steamでウィッシュリスト
