          - label: 白
            value: white
          - label: ピンク
            value: pink
          - label: 紺
            value: navy
          default: paper
        - name: gen
          label: げんちゃん
          widget: object
          fields:
          - name: pose
            label: ポーズ
            widget: select
            options:
            - label: なし
              value: none
            - label: 指さし
              value: point
            - label: 肩をすくめる
              value: shrug
            - label: しょんぼり
              value: tired
            - label: 手を振る
              value: wave
            - label: 看板を持つ
              value: sign
            - label: 寝転がる
              value: sleep
            default: none
          - name: say
