<title>G3 -GenGorouGames- | インディーゲームチーム</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Yusei+Magic&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 居間のテレビ。ブロックの並び・中身は content/home.json（管理画面）で変えられる。最初の画面はゲームを「チャンネル」で切り替えるテレビ、その前でげんちゃんが居眠り。下の各セクションにも、げんちゃんが一言ずつ口を出す */
:root{
  color-scheme: light;
  --paper:#f2f3f8;   /* 地：げんちゃんの撮影背景と同じ、ほんのり青い白 */
  --card:#ffffff;
  --ink:#262b5e;     /* 文字：げんちゃんの手足の紺 */
  --ink-2:#5d6392;   /* 補足 */
  --line:#d8dbea;
  --pink:#f19aac;    /* げんちゃんの体 */
  --pink-ink:#c94a68;/* ピンクの文字用（白地で読める濃さ） */
  --teal:#1aa9b1;    /* ヘッドホンの縁 */
  --tv:#262b5e;      /* テレビの枠 */
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-voice:"Yusei Magic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","MS Gothic",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}

/* げんちゃんの吹き出し（全セクション共通） */
.say{font-family:var(--f-voice);font-size:1.05rem;line-height:1.5;background:var(--card);color:var(--ink);padding:.55em .9em;border-radius:16px;border:2px solid var(--ink);position:relative;display:inline-block;max-width:16em}
.say::after{content:"";position:absolute;width:12px;height:12px;background:var(--card);border:2px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg);bottom:-8px;left:22px}
.say.r::after{left:auto;right:22px}

/* ヘッダー */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{font-family:var(--f-display);font-size:1.35rem;text-decoration:none;display:flex;align-items:center;gap:.55em}
.logo i{font-style:normal;font-family:var(--f-dot);font-size:.75rem;color:var(--ink-2)}
nav{display:flex;gap:22px;flex-wrap:wrap;font-weight:700;font-size:.9rem}
nav a{text-decoration:none}
nav a:hover{color:var(--pink-ink)}
nav .est{color:var(--pink-ink)}

/* 最初の画面：テレビ */
.hero{padding-block:20px 40px}
.hero-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,5.2vw,3.6rem)}
.hero-head p{margin:0;color:var(--ink-2);max-width:26em}
.room{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;align-items:end}
.tv{background:var(--tv);border-radius:26px;padding:14px;position:relative;min-width:0}
.tv::after{content:"";position:absolute;left:50%;bottom:-18px;width:28%;height:18px;transform:translateX(-50%);background:var(--tv);border-radius:0 0 10px 10px;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#0d0f24}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.screen img.on{opacity:1}
.screen .noise{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.osd{position:absolute;left:0;right:0;bottom:0;padding:42px 20px 16px;background:linear-gradient(transparent,rgba(13,15,36,.85));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.osd-ch{font-family:var(--f-dot);font-size:.85rem;color:#8ff1f5;letter-spacing:.08em}
.osd h2{font-size:clamp(1.4rem,3.2vw,2.2rem);color:#fff}
.osd p{margin:.2em 0 0;font-size:.95rem;max-width:30em;color:#e6e7f5}
.osd a{flex:none;background:var(--pink);color:var(--ink);font-weight:700;text-decoration:none;padding:.6em 1.2em;border-radius:10px;font-size:.95rem}
.osd a:hover{background:#fff}
.ch-dot{position:absolute;top:14px;right:16px;font-family:var(--f-dot);color:#8ff1f5;font-size:1.1rem;text-shadow:0 0 6px rgba(143,241,245,.6)}

.remote{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:34px;padding-right:300px}
.remote button{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;color:var(--ink);transition:border-color .2s}
.remote button[aria-pressed="true"]{border-color:var(--ink)}
.remote img{aspect-ratio:460/215;width:100%;object-fit:cover;border-radius:6px;background:var(--paper)}
.remote span{font-family:var(--f-dot);font-size:.75rem;color:var(--ink-2)}
.remote b{font-size:.85rem;line-height:1.3}

.genchan{position:relative;height:420px;margin-left:-40px;min-width:0}
#gl{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.genchan .say{position:absolute;top:6px;left:24px;z-index:2}
.genchan .hint{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:var(--f-dot);font-size:.75rem;color:var(--ink-2)}
.fallback{position:absolute;inset:40px 0 20px;background:url(/img/pose_tired.webp) center bottom/contain no-repeat}

/* セクション */
section{padding-block:72px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:36px}
.sec-head h2{font-size:clamp(1.9rem,4vw,2.8rem)}
.sec-head p{margin:0;color:var(--ink-2)}

/* 作品：1本ずつ大きく、げんちゃんが横から口を出す */
.games{display:grid;gap:72px}
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center}
.game:nth-child(even) .shot{order:2}
.shot{position:relative;min-width:0}
.shot .frame{border-radius:16px;overflow:hidden;border:3px solid var(--ink);background:var(--ink);aspect-ratio:16/9;max-width:100%}
.shot .frame img{width:100%;height:100%;object-fit:cover}
.shot .frame.phone{aspect-ratio:auto;display:flex;gap:6px;padding:6px;justify-content:center;background:var(--ink)}
.shot .frame.phone img{width:31%;height:auto;object-fit:contain;border-radius:8px}
.shot .frame.watch{display:grid;grid-template-columns:auto auto;gap:24px;place-content:center;align-items:center;background:#0b0b10;color:#e9e6f2}
.shot .frame.watch img{width:120px;height:auto;border-radius:12px;border:1px solid #2a2a38}
.shot .frame.watch span{font-family:var(--f-dot);font-size:clamp(1.6rem,3.4vw,2.4rem);letter-spacing:.3em;line-height:1.2}
.shot .frame.watch small{display:block;font-size:.8rem;letter-spacing:.1em;color:#9a96ad;margin-top:6px}
.shot .gen img.flip{transform:scaleX(-1)}
.shot .gen{position:absolute;width:24%;max-width:160px;bottom:-40px;right:-22px;filter:drop-shadow(0 6px 10px rgba(38,43,94,.18))}
.game:nth-child(even) .shot .gen{right:auto;left:-26px}
.shot .gen .say{position:absolute;bottom:92%;right:30%;white-space:nowrap;font-size:.95rem;max-width:none}
.game:nth-child(even) .shot .gen .say{right:auto;left:30%}
.ginfo{min-width:0;display:grid;gap:12px;align-content:center}
.gmeta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-family:var(--f-dot);font-size:.85rem;color:var(--ink-2)}
.gmeta .st{color:var(--teal)}
.gmeta .st.soon{color:var(--pink-ink)}
.ginfo h3{font-size:clamp(1.7rem,3.4vw,2.4rem)}
.ginfo p{margin:0;max-width:32em}
.glinks{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}
.glinks a{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--pink)}
.glinks a:hover{color:var(--pink-ink)}

/* 汎用レイアウト：本文＋げんちゃん（左右・大きさ・ずらしは管理画面で選ぶ） */
.split{display:grid;gap:40px;align-items:center;grid-template-columns:minmax(0,1fr) var(--gw,240px)}
.split.side-left{grid-template-columns:var(--gw,240px) minmax(0,1fr)}
.split.side-left .genbox{order:-1}
.split.sz-s{--gw:170px}.split.sz-m{--gw:240px}.split.sz-l{--gw:320px}
.split .main,.solo{min-width:0}
.genbox{position:relative;margin:0;padding-top:60px;min-width:0}
.genbox .say{position:absolute;top:0;left:6px;z-index:1}
.genbox img{width:100%;filter:drop-shadow(0 6px 10px rgba(38,43,94,.14))}
img.flip{transform:scaleX(-1)}
.genbox.sh-up{transform:translateY(-32px)}.genbox.sh-down{transform:translateY(32px)}

/* 背景色 */
.bg-white{background:var(--card)}
.bg-pink{background:var(--pink)}
.bg-pink .sec-head p,.bg-pink p{color:var(--ink)}
.bg-navy{background:var(--ink);color:#fff}
.bg-navy .sec-head p,.bg-navy p,.bg-navy .conds{color:#d9dbf0}
.bg-navy .btn{background:var(--pink);color:var(--ink)}
.bg-navy .btn:hover{background:#fff}
.bg-navy .sns a,.bg-navy .glinks a{color:#fff}
.bg-navy .gmeta{color:#c5c8e6}

/* お知らせ */
.log{list-style:none;margin:0;padding:0;background:var(--card);color:var(--ink);border-radius:16px;border:2px solid var(--line)}
.log li{display:grid;grid-template-columns:7.2em minmax(0,1fr);gap:16px;padding:16px 22px;border-bottom:1px dashed var(--line)}
.log li:last-child{border-bottom:0}
.log time{font-family:var(--f-dot);color:var(--teal);font-variant-numeric:tabular-nums}
.log span{display:block;font-size:.8rem;color:var(--ink-2)}
.log b{font-weight:700}

/* お仕事依頼 */
.blk-work h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:14px}
.blk-work p{margin:0 0 18px;max-width:34em}
.svc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 24px;padding:0;list-style:none;font-size:.92rem;font-weight:500}
.svc li::before{content:"・"}
.conds{font-family:var(--f-dot);font-size:.85rem;margin-bottom:22px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:.85em 1.6em;border-radius:12px}
.btn:hover{background:#3a4183}

/* G3について */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.creed{font-family:var(--f-display);font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.3}
.creed em,h1 em,h2 em,h3 em{font-style:normal;color:var(--pink-ink)}
.bg-pink .creed em,.bg-pink h2 em{color:var(--ink)}
.bg-navy .creed em,.bg-navy h2 em{color:var(--pink)}
p em{font-style:normal;font-weight:700;color:var(--pink-ink)}
.bg-navy p em{color:var(--pink)}
.blk-about p{margin:0 0 12px;max-width:34em}
h2.small{font-size:1.3rem;margin-bottom:10px}
.sns{display:flex;gap:20px;flex-wrap:wrap;font-weight:700;margin-top:18px}
.sns a{text-decoration:underline;text-decoration-color:var(--teal);text-decoration-thickness:2px;text-underline-offset:4px}

/* 自由ブロック */
.free{display:grid;gap:32px;align-items:center;grid-template-columns:var(--iw) minmax(0,1fr)}
.free.pos-right{grid-template-columns:minmax(0,1fr) var(--iw)}
.free.pos-right .fimg{order:2}
.free.pos-top{grid-template-columns:1fr}
.free.isz-s{--iw:minmax(0,.6fr)}.free.isz-m{--iw:minmax(0,1fr)}.free.isz-l{--iw:minmax(0,1.5fr)}
.free.pos-top.isz-s .fimg{max-width:420px}.free.pos-top.isz-m .fimg{max-width:720px}
.fimg{min-width:0}
.fimg img{width:100%;border-radius:16px;border:3px solid var(--ink)}
.ftext{min-width:0}
.ftext .sec-head{margin-bottom:16px}
.ftext p{margin:0 0 16px;max-width:36em}

footer{position:relative;background:var(--ink);color:#d9dbf0;padding-block:96px 28px;margin-top:80px;font-size:.85rem}
.sleeper{position:absolute;top:-78px;left:50%;transform:translateX(-50%);width:230px}
.sleeper .say{position:absolute;top:-24px;right:-74px;font-size:.95rem}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:860px){
  .room{grid-template-columns:1fr}
  .genchan{height:300px;margin:-60px 0 0;width:240px;justify-self:end}
  .remote{padding-right:0;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:8px}
  .game,.split,.split.side-left,.two,.free,.free.pos-right{grid-template-columns:1fr;gap:28px}
  .split .genbox{max-width:240px;justify-self:center;order:0}
  .free.pos-right .fimg{order:0}
  .genbox.sh-up,.genbox.sh-down{transform:none}
  .game:nth-child(even) .shot{order:0}
  .shot .gen{width:34%;right:-6px;bottom:-30px}
  .game:nth-child(even) .shot .gen{left:-6px}
  nav{gap:14px;font-size:.82rem}
  .logo i{display:none}
}
@media (max-width:520px){
  nav a:not(.est){display:none}
  .osd p{display:none}
  .log li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>

</head>

<script>

const POSES={point:"/img/pose_point.webp",shrug:"/img/pose_shrug.webp",tired:"/img/pose_tired.webp",wave:"/img/pose_wave.webp",sign:"/img/genchan_sign.webp",sleep:"/img/pose_sleep.webp"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 文章の書式：改行→改行、*ここ*→ピンクの強調、空行→段落 */
const inl=s=>esc(s).replace(/\*([^*\n]+)\*/g,"<em>$1</em>").replace(/\n/g,"<br>");
const paras=s=>String(s||"").split(/\n\s*\n/).filter(x=>x.trim()).map(p=>`<p>${inl(p.trim())}</p>`).join("");
const lk=x=>Array.isArray(x)?x:[x.label,x.url];
const has=a=>Array.isArray(a)?a.length>0:!!a;
const ext=u=>/^https?:/.test(u||"")?' target="_blank" rel="noopener"':'';
const poseSrc=p=>POSES[p]||(String(p||"").startsWith("/")?p:"");

/* げんちゃん（画像＋吹き出し）。位置・大きさ・ずらし・反転は管理画面で選ぶ */
function genFig(g,cls){
  if(!g||!g.pose||g.pose==="none") return "";
  const src=poseSrc(g.pose); if(!src) return "";
  return `<figure class="genbox ${cls||""} sz-${g.size||"m"} sh-${g.shift||"normal"}">${g.say?`<div class="say">${inl(g.say)}</div>`:""}<img src="${esc(src)}" alt="げんちゃん" loading="lazy"${g.flip?' class="flip"':''}></figure>`;
}
function split(inner,g){
  const fig=genFig(g); if(!fig) return `<div class="solo">${inner}</div>`;
  return `<div class="split side-${g.side==="left"?"left":"right"} sz-${g.size||"m"}"><div class="main">${inner}</div>${fig}</div>`;
}
function head(b){return (b.title||b.lead)?`<div class="sec-head">${b.title?`<h2>${inl(b.title)}</h2>`:""}${b.lead?`<p>${inl(b.lead)}</p>`:""}</div>`:"";}
function btn(b){return b&&b.label&&b.href?`<a class="btn" href="${esc(b.href)}"${ext(b.href)}>${esc(b.label)}</a>`:"";}

/* ---------- ブロックごとの表示 ---------- */
const R={
  tv(b,C){
    return `<div class="wrap hero">
      <div class="hero-head"><h1>${inl(b.title)}</h1>${b.lead?`<p>${inl(b.lead)}</p>`:""}</div>
      <div class="room"><div>
        <div class="tv"><div class="screen" data-screen>
          <div class="ch-dot" data-chdot>CH 1</div><div class="noise"></div>
          <div class="osd"><div><div class="osd-ch" data-osdch></div><h2 data-osdt></h2><p data-osdp></p></div><a data-osda href="#" target="_blank" rel="noopener"></a></div>
        </div></div>
        <div class="remote" data-remote aria-label="チャンネル"></div>
      </div>
      <div class="genchan">
        <canvas id="gl" aria-label="G3のマスコット、げんちゃん。クリックすると起きる"></canvas>
        <div class="say r" id="bubble">${esc((b.sleep||[])[0]||"…すう。")}</div>
        <div class="fallback" id="fb" hidden></div>
        <div class="hint" id="hint">${esc(b.hint||"クリックで起こす")}</div>
      </div></div></div>`;
  },
  games(b,C){
    const list=C.games.map(g=>{
      let media;
      if(has(g.phone)) media=`<div class="frame phone">${g.phone.map(s=>`<img src="${esc(s)}" alt="${esc(g.t)}の画面" loading="lazy">`).join("")}</div>`;
      else if(has(g.shots)) media=`<div class="frame"><img src="${esc(g.shots[0])}" alt="${esc(g.t)}のゲーム画面" loading="lazy"></div>`;
      else if(has(g.watch)) media=`<div class="frame watch"><img src="${esc(g.watch)}" alt="${esc(g.t)}のアイコン" loading="lazy"><span>${esc(String(g.t).toUpperCase())}${g.tagline?`<small>${esc(g.tagline)}</small>`:""}</span></div>`;
      else media=`<div class="frame"></div>`;
      const gen=g.gen?`<div class="gen">${g.say?`<div class="say">${inl(g.say)}</div>`:""}<img src="${esc(poseSrc(g.gen)||g.gen)}" alt="" loading="lazy"${g.flip?' class="flip"':''}></div>`:"";
      return `<article class="game"><div class="shot">${media}${gen}</div>
        <div class="ginfo"><div class="gmeta"><span class="st ${g.soon?"soon":""}">${esc(g.st)}</span><span>${esc(g.plat)}</span></div>
        <h3>${esc(g.t)}</h3><p>${inl(g.s)}</p>
        <div class="glinks">${(g.links||[]).map(lk).filter(x=>x[0]&&x[1]).map(([l,u])=>`<a href="${esc(u)}"${ext(u)}>${esc(l)}</a>`).join("")}</div></div></article>`;
    }).join("");
    return `<div class="wrap">${head(b)}<div class="games">${list}</div></div>`;
  },
  news(b,C){
    const items=[...C.topics].sort((x,y)=>String(y.d).localeCompare(String(x.d))).slice(0,b.limit||99);
    const log=`<ul class="log">${items.map(x=>`<li><time>${esc(x.d)}</time><div><span>${esc(x.p)}</span><b>${inl(x.t)}</b></div></li>`).join("")}</ul>`;
    return `<div class="wrap">${split(head(b)+log,b.gen)}</div>`;
  },
  work(b){
    const inner=`<h2>${inl(b.title)}</h2>${paras(b.body)}
      ${has(b.services)?`<ul class="svc">${b.services.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
      ${b.conds?`<div class="conds">${inl(b.conds)}</div>`:""}${btn(b.button)}`;
    return `<div class="wrap">${split(inner,b.gen)}</div>`;
  },
  about(b,C){
    const inner=`<div class="two"><div class="creed">${inl(b.big)}</div><div>${b.title?`<h2 class="small">${inl(b.title)}</h2>`:""}${paras(b.body)}
      ${b.showSns!==false&&has(C.site.sns)?`<div class="sns">${C.site.sns.filter(s=>s.label&&s.url).map(s=>`<a href="${esc(s.url)}"${ext(s.url)}>${esc(s.label)}</a>`).join("")}</div>`:""}</div></div>`;
    return `<div class="wrap">${split(inner,b.gen)}</div>`;
  },
  free(b){
    const img=b.image?`<div class="fimg pos-${b.imagePos||"left"} isz-${b.imageSize||"m"}"><img src="${esc(b.image)}" alt="${esc(b.imageAlt||b.title||"")}" loading="lazy"></div>`:"";
    const text=`<div class="ftext">${head({title:b.title})}${paras(b.body)}${btn(b.button)}</div>`;
    const inner=img?`<div class="free pos-${b.imagePos||"left"} isz-${b.imageSize||"m"}">${img}${text}</div>`:text;
    return `<div class="wrap">${split(inner,b.gen)}</div>`;
  }
};
const DEF_ID={tv:"top",games:"games",news:"news",work:"work",about:"about"};
const DEF_BG={work:"pink"};

function render(C){
  const S=C.site;
  if(S.title) document.title=S.title;
  const logo=document.getElementById("logo"); logo.innerHTML=`${esc(S.logo||"G3")}${S.logoSub?`<i>${esc(S.logoSub)}</i>`:""}`;
  document.getElementById("nav").innerHTML=(S.nav||[]).filter(n=>n.label).map(n=>`<a href="${esc(n.href||"#")}"${n.accent?' class="est"':''}${ext(n.href)}>${esc(n.label)}</a>`).join("");
  const F=S.footer||{};
  document.getElementById("fCopy").textContent=F.copy||"";
  document.getElementById("fContact").textContent=F.contact||"";
  document.getElementById("sleeper").hidden=F.sleeper===false;
  document.getElementById("sleepSay").innerHTML=inl(F.say||"");
  document.getElementById("sleepSay").hidden=!F.say;

  const main=document.getElementById("blocks");
  main.innerHTML=(C.home.blocks||[]).filter(b=>b&&b.show!==false&&R[b.type]).map(b=>{
    const tag=b.type==="tv"?"div":"section";
    const id=b.id||DEF_ID[b.type]||"";
    const bg=b.bg||DEF_BG[b.type]||"paper";
    return `<${tag} class="blk blk-${b.type} bg-${esc(bg)}"${id?` id="${esc(id)}"`:""}>${R[b.type](b,C)}</${tag}>`;
  }).join("");
  const tvB=(C.home.blocks||[]).find(b=>b&&b.type==="tv"&&b.show!==false);
  if(tvB){ initTV(tvB,C.games); initGenchan(tvB); }
  if(location.hash){ const t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
}

/* ---------- テレビ：チャンネル切り替え ---------- */
function initTV(b,GAMES){
  const scr=document.querySelector("[data-screen]"), remote=document.querySelector("[data-remote]");
  const q=s=>document.querySelector(s);
  const tv=GAMES.filter(g=>has(g.shots)||has(g.phone)||has(g.watch));
  if(!tv.length) return;
  const slides=tv.map(g=>{const i=new Image(); const wide=has(g.shots); i.src=wide?g.shots[0]:(has(g.phone)?g.thumb:g.watch); i.alt=g.t+"の画面";
    if(!wide){i.style.objectFit="contain";i.style.background="#0d0f24"} scr.insertBefore(i,scr.firstChild); return i});
  remote.innerHTML=tv.map((g,i)=>`<button type="button" aria-pressed="false" data-i="${i}"><img src="${esc(g.thumb)}" alt=""><span>CH ${i+1}</span><b>${esc(g.t)}</b></button>`).join("");
  let cur=-1,timer;
  function tune(i){ cur=i; const g=tv[i];
    slides.forEach((s,k)=>s.classList.toggle("on",k===i));
    [...remote.children].forEach((x,k)=>x.setAttribute("aria-pressed",k===i));
    q("[data-chdot]").textContent="CH "+(i+1);
    q("[data-osdch]").textContent="CH "+(i+1)+" / "+String(g.plat||"").split(" ")[0].toUpperCase();
    q("[data-osdt]").textContent=g.t; q("[data-osdp]").textContent=g.s;
    const a=q("[data-osda]"), L=(g.links||[]).map(lk)[0]; a.hidden=!L; if(L){a.href=L[1]; a.textContent=L[0];}
  }
  const sec=Math.max(2,+b.interval||6);
  function auto(){clearInterval(timer); if(!matchMedia("(prefers-reduced-motion: reduce)").matches) timer=setInterval(()=>tune((cur+1)%tv.length),sec*1000)}
  remote.addEventListener("click",e=>{const x=e.target.closest("button"); if(!x) return; tune(+x.dataset.i); auto()});
  tune(0); auto();
}

/* ---------- 3Dのげんちゃん：普段は居眠り、クリックで起きて手を振る ---------- */
function initGenchan(b){
  const canvas=document.getElementById("gl"), bubble=document.getElementById("bubble"), hint=document.getElementById("hint");
  const fail=()=>{document.getElementById("fb").hidden=false;canvas.hidden=true;hint.hidden=true};
  if(!window.THREE||!THREE.GLTFLoader||!window.GENCHAN_GLB){fail();return}
  let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true})}catch(e){fail();return}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.9;
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(26,1,.1,50);
  cam.position.set(-0.6,1.1,6.2); cam.lookAt(0,0.8,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0xc9cde6,0.75));
  const key=new THREE.DirectionalLight(0xffffff,1.2); key.position.set(-2.5,3,4); scene.add(key);
  const rim=new THREE.DirectionalLight(0x8ff1f5,1.0); rim.position.set(2.5,2.5,-3); scene.add(rim);
  const bin=Uint8Array.from(atob(window.GENCHAN_GLB),c=>c.charCodeAt(0)).buffer;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleepy=has(b.sleep)?b.sleep:["…すう。"], awake=has(b.wake)?b.wake:["…なに。"];
  const pick=a=>a[Math.random()*a.length|0];
  let mixer,intro,sleep,root,busy=false;
  new THREE.GLTFLoader().parse(bin,"",g=>{
    root=g.scene; root.rotation.y=-0.35; scene.add(root);
    const clip=g.animations[0]; mixer=new THREE.AnimationMixer(root);
    sleep=mixer.clipAction(THREE.AnimationUtils.subclip(clip,"sleep",0,24,30)); sleep.setLoop(THREE.LoopPingPong); sleep.play();
    intro=mixer.clipAction(clip); intro.setLoop(THREE.LoopOnce); intro.clampWhenFinished=true;
    mixer.addEventListener("finished",e=>{ if(e.action!==intro) return;
      setTimeout(()=>{busy=false; bubble.textContent=pick(sleepy); hint.textContent=b.hint||"クリックで起こす"; sleep.reset().play(); intro.crossFadeTo(sleep,.8,false)},2600)});
  },fail);
  canvas.addEventListener("click",()=>{ if(!intro||busy) return; busy=true; hint.textContent="";
    sleep.stop(); intro.reset().play(); bubble.textContent="…ん。";
    setTimeout(()=>bubble.textContent=pick(awake),2400)});
  function size(){const w=canvas.clientWidth,h=canvas.clientHeight; if(!w) return; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix()}
  new ResizeObserver(size).observe(canvas); size();
  const clock=new THREE.Clock();
  (function loop(){requestAnimationFrame(loop); const dt=clock.getDelta(); if(mixer) mixer.update(reduce?0:dt); renderer.render(scene,cam)})();
}

(function(){

  });
})();
